#-------------------提示-------------------

# 本程序支持零配置启动，即：本配置文件中为空也不影响启动
# 也支持无此配置文件启动，这两种情况都是使用代码(@ZConfigurationProperties标记的类)中
# 默认配置来启动

# 打出的jar包程序使用java语法启动，如下：
# java [jvm参数] -jar myApp.jar [应用参数]
# 两个[]部分为非必填项，如：最简单的启动命令如下：
# java -jar myApp.jar
# [应用参数]部分支持格式为--key=value，如：
# --server.port=88 --test.name=张三，则启动命令如下：
# java -jar myApp.jar --server.port=88 --test.name=张三
# 此形式支持的配置项同@ZConfigurationProperties标记的类中的配置项，
# 并且优先级 > .properties文件 > @ZConfigurationProperties标记的类中的默认值

#-------------------提示-------------------


# 下面配置均为程序中 @ZConfigurationProperties 类的默认值，写在这里仅为展示配置项
# 如需自定义配置项，在本文件中覆盖掉即可
# 如：设定redis.host=192.168.1.15

# [支持热更新] 意为：程序在运行中，直接修改本配置文件中的值，保存以后就自动在程序中更新为新值，不需要重启程序。
# 但是配置值校验不通过时会重置为旧值，如 server.client.qps=ABC 会出现异常，然后重置为旧值。

# ServerConfigurationProperties 
# -------------------服务器相关配置-------------------

# http服务器监听的端口号
# 默认值：80,支持范围：1-65535
server.port=80

# 对于http请求，是否响应 ZSESSIONID 的Cookie，
# 默认值：false
server.response.z.session.id=false

# http响应头中的 Server字段值
# 默认值：ZServer
server.name=ZServer

# 读取http请求时分配的byte[]的初始大小，单位：字节
# 默认值：2048,支持范围：100-10240
server.byte.buffer.size=2048

# 限制上传文件的最大KB数
# 默认值：1024 * 50,支持范围：1 - 1024 * 1000位
server.upload.file.size=51200

# 上传文件时从[一次性读取内存]改为[边读边写入到临时文件]的阈值,单位：KB,
# 默认值：1024 * 50,支持范围：100 - 1024 * 1024 * 10
# 20260112暂时废弃，统一写入临时文件
server.upload.file.to.temp.size=1024

# 上传文件时存放临时文件的目录
# 默认值：默认为[user.dir]下的temp目录
server.upload.temp.dir=

# 处理http请求的最大线程数量
# 默认值：Runtime.getRuntime().availableProcessors() * 4,支持范围：1 - 2000
# 注意：这个不是默认值，默认值是上面代码执行结果
server.thread.Count=48

# 处理http请求的线程的名称前缀，生成的线程以此为前缀分别命名为1、2、3以此类推
# 默认值：hT-
server.thread.name=hT-

# 对于程序中resources目录下的静态资源是否启动缓存，
# 默认值：true
# 支持热更新
server.static.resource.cache.enable=true

# 是否启动服务器QPS[server.qps]限制，
# 默认值：false
# 支持热更新
server.qps.limit.enabled=false

# 服务器QPS最大值限制，
# 默认值：10000 * 10,支持范围：1 - 10000 * 1000
# 注意：此值最小支持0，配置为0表示不接受任何请求
# 支持热更新
server.qps=2000000

# 请求超过[server.qps]时给客户端的提示语，默认值：访问频繁，请稍后再试
# 支持热更新
server.qps.exceed.message=访问频繁,请稍后再试

# 请求信息的header的大小限制，单位：字节
# 任意一个header的value超过此值，会响应431
# 支持方位：512 - 1024 * 16
# 默认值：500
server.request.header.size.limit=4096

# 是否启用对一个client的qps限制
# 默认值：false
server.enable.client.qps=false

# 对于同一个客户端的QPS限制，
# 当前程序中暂定为ip和User-Agent相同就认为是同一个客户端，
# 如需自定义[如何判定为同一个客户端]可覆盖RequestValidatorAdapter中相关方法
# 默认值：2000000,支持范围：10 - 10000 * 1000
# 支持热更新
server.client.qps=2000000


# 对于同一个ZSESSIONID的QPS限制
# 注意：仅当 [server.response.z.session.id]配置为true时本配置项才生效
# 默认值：2000000,支持范围：10 - 10000 * 1000
# 支持热更新
server.session.id.qps=2000000

# 是否启用内置的 StaticController
# 如果配置为false，则是不需要处理静态文件(resources目录下的静态文件/[server.static.path]配置的路径的静态文件)
# 或者是自定义了处理静态文件的 Controller
# 默认值：true
server.static.controller.enable=true

# StaticController 接口响应的Content-Type
# <k,v>配置为<文件后缀名,响应的Content-Type>，如:
# server.static.controller.content.type.jpg=image/jpg
# 默认值：如下
server.static.controller.content.type.jpg=image/jpg
server.static.controller.content.type.mp4=video/mp4 
server.static.controller.content.type.mp3=audio/mp3 
server.static.controller.content.type.txt=text/plain 
server.static.controller.content.type.css=text/css
server.static.controller.content.type.pdf=application/pdf
server.static.controller.content.type.ico=image/vnd.microsoft.ico
server.static.controller.content.type.gif=image/gif
server.static.controller.content.type.png=image/png
server.static.controller.content.type.jpeg=image/jpeg
server.static.controller.content.type.doc=application/msword
server.static.controller.content.type.js=application/javascript
server.static.controller.content.type.html=text/html
server.static.controller.content.type.wav=audio/wav


# StaticController 中允许的Referer，如：http://xxx.com/
# 非来自此Referer的请求会被拒绝-响应403
# 注意：本配置项仅在[staticPath]未配置的情况下，即未启用静态文件服务器的情况下才生效。
# 默认值：无
server.static.controller.referers.allowed[0]=

# StaticController 放静态文件的内存缓存的最大容量，单位：字节
# 默认值：1024 * 1024 * 100 = 100MB
server.static.controller.memory.cache.capacity=104857600

# StaticController 响应时每次读取的BufferSize，单位：字节
# 默认值：1024 * 512 = 512KB
# 最小值：1024
# 最大值：1024 * 1024 * 4 = 4MB
server.static.response.buffer.size=524288

# 对于长连接的超时时间，超过此值，服务器会关闭连接对象，单位：秒
# 默认值：10 ,支持范围：1 - 120
server.keep.alive.timeout=10

# session存储方式，支持方式见 ZSessionStorageTypeEnum枚举，默认值：MEMORY
# 下面注释掉，因为本文件还不支持使用代码方式配置
# server.session.storage.type=ZSessionStorageTypeEnum.MEMORY.name()
server.session.storage.type=MEMORY

# session超时秒数，超时此值服务器则会销毁session，单位：秒
# 默认值：1860（31分钟）,支持范围：10 - 60 * 60 * 24 * 10
# 支持热更新
server.session.max.timeout=1860

# 允许同时存在的session的最大数量，超过此值会自动删除最近最少访问的
# 默认值：10000 * 100
# 最小值：1
# 最大值：Integer.MAX_VALUE
server.session.max.active=1000000

# 配置读取硬盘上的静态资源的目录，
# 注意：此值优先于 [server.static.prefix]，配置了此值，则会
# 从硬盘上读取静态资源，而不使用 [server.static.prefix]配置值
# 默认值：空，即不从硬盘读取静态资源。
server.static.path=

# 配置 resources目录下的静态资源资源目录
# 即读取目录前缀为 resources/static/
# 默认值：/static
server.static.prefix=/static


# 对于http响应的body，是否启用压缩
# 默认值：true
server.compression.enable=true

# 对于http响应的哪些Content-Type启用压缩，如需配置多个用【,】分开。
# 注意：此值配置只有在 server.compression.enable=true 时才有效
# 默认值：text/html,text/xml,text/csv,text/css,text/plain,text/javascript,application/json,application/xml,application/javascript,image/svg+xml,font/woff2,font/woff,font/otf,font/ttf
server.compression.types=text/html,text/xml,text/csv,text/css,text/plain,text/javascript,application/json,application/xml,application/javascript,image/svg+xml,font/woff2,font/woff,font/otf,font/ttf

# 当 server.compression.enable=true 时，server.gzip.types资源文件大于多少KB才启用压缩
# 单位：KB，默认值：1
# 调大此值，会降低CPU占用同时增加带宽占用；调小此值，会增加CPU占用同时降低带宽占用
server.compression.min.length=1

# 自定义响应头，默认值：空
# 如：解决CORS问题，配置如下：
# server.responseHeaders.Access-Control-Allow-Origin=*
# 如需配置多个，可如下配置
# server.response.headers.a=A
# server.response.headers.b=B
# server.response.headers.c=C
server.response.headers=

# 程序启动时是否打印 @ZConfigurationProperties 的类
# 注意：如配置信息有敏感信息，则设置为false
# 默认值：false
server.print.configuration.properties=false

# 程序启动时是否输出生成的代理类的源码
# 默认值：false
server.print.proxy.class=false

# 是否打印请求的header
# 默认值：false
server.show.http.header=false
	
# ZApplicationEventConfigurationProperties 
# -------------------事件发布机制相关配置-------------------

# 处理事件请求的最大线程数量
# 默认值：Math.min(10, Runtime.getRuntime().availableProcessors()) 支持范围：1 - 1000
# 注意：这个不是默认值，默认值是上面代码执行结果
# 注意：注释了下面的配置项，因为不支持动态配置
#application.event.thread.count=10

# 处理事件请求的线程名称前缀
# 默认值：applicationEvent-Thread-
application.event.thread.name.prefix=applicationEvent-Thread-

# ZCacheConfigurationProperties 
# -------------------缓存机制相关配置-------------------

# 内置的缓存的实现方式
# 默认值：MEMORY,支持范围：MEMORY、REDIS、MIXED
cache.type=MEMORY

# 是否启动内置的缓存功能
# 默认值：true
cache.enable=true

# ZMixConfigurationProperties 
# -------------------MIXED缓存实现的相关配置-------------------

# MIXED模式下，缓存内容在内存中的过期时间，单位：秒
# 默认值：1,支持范围：1 - 60
cache.type.mix.memory.expire=1

# ZAsyncProperties 
# -------------------异步处理的相关配置-------------------
# 配置 @ZAsync 注解使用的线程池相关信息 

# 配置线程池中最大线程数
# private static final int MIN = 10;
# 默认值：Math.min(MIN, Runtime.getRuntime().availableProcessors())
# 即：最小为10
# 注意：这个不是默认值，默认值是上面代码执行结果
async.thread.count=10

# 线程名称前缀
# 默认值：async-Thread-
async.thread.name=async-Thread-


# ZControllerAdviceThrowableConfigurationProperties 
# -------------------API异常捕捉器的相关配置-------------------

# API执行出现异常时，返回给客户端的错误码，是响应体的错误码，
# 不是http状态码
# 默认值：50000
controller.advice.error.code=50000


# ZRequestMappingConfigurationProperties 
# -------------------@ZRequestMapping的相关配置-------------------

# @ZRequestMapping 直接的默认qps，默认值：50000
request.mapping.qps=50000


# RequestValidatorConfigurationProperties
# -------------------默认请求处理器的相关配置-------------------

# 平滑处理的User-Agent
# 判断逻辑：请求头中User-Agent包含如下任一内容就进行平滑处理，区分大小写
# 默认值：Sets.newHashSet("Safari", "Chrome", "Firefox","Edge", "Edg", "Opera", "OPR")
request.smooth.user.agent[0]=Safari
request.smooth.user.agent[1]=Chrome
request.smooth.user.agent[2]=Firefox
request.smooth.user.agent[3]=Edge
request.smooth.user.agent[4]=Edg
request.smooth.user.agent[5]=Opera
request.smooth.user.agent[6]=OPR

# 是否打印(LOG.debug)http请求内容
# 默认值：false
request.print.http=false

# ZMailNotificationConfigurationProperties
# -------------------邮件通知的相关配置-------------------

# 是否启用邮件通知
# 注意：所有的内置通知(下面的[mail.notification.XX.event]配置项)都是以本值为true为前提，本值非true时不会有任何通知
# 默认值：false
mail.notification.enable=false

# 是否关注[shutdown]事件。本配置想为true时，当程序正常退出/异常退出，
# 则会发邮件通知[mail.notification.receiver]
# 此功能使用hook实现
# 默认值：false
mail.notification.shutdown.event=false

# 关注的事件(异常)，当程序触发这些事件(异常)时，会发邮件给 receiver
# 默认值：无
# 此功能 @see ZControllerAdviceActuator.execute 方法
# 配置如：[0]=StackOverflowError [1]=NullPointerException 等等
mail.notification.monitored.events[0]=
mail.notification.monitored.events[1]=

# 发送邮件的服务器地址，如：smtp.qq.com
# 默认值：无
mail.notification.host=

# 发送邮件的邮箱服务器端口号，如：587
# 默认值：无
mail.notification.port=

# 发送邮件的邮箱地址，如：123456@qq.com
# 默认值：无
mail.notification.sender=

# 发送邮件的邮箱的密码/授权码，如：QWERTY
# 默认值：无
mail.notification.password=

# 接收邮件通知的邮箱，如：234567@qq.com
# Set类型，支持多个，用[0] [1] [2]的方式配置
# 默认值：无
mail.notification.receiver[0]=
mail.notification.receiver[1]=

=======
#-------------------提示-------------------

# 本程序支持零配置启动，即：本配置文件中为空也不影响启动
# 也支持无此配置文件启动，这两种情况都是使用代码(@ZConfigurationProperties标记的类)中
# 默认配置来启动

# 打出的jar包程序使用java语法启动，如下：
# java [jvm参数] -jar myApp.jar [应用参数]
# 两个[]部分为非必填项，如：最简单的启动命令如下：
# java -jar myApp.jar
# [应用参数]部分支持格式为--key=value，如：
# --server.port=88 --test.name=张三，则启动命令如下：
# java -jar myApp.jar --server.port=88 --test.name=张三
# 此形式支持的配置项同@ZConfigurationProperties标记的类中的配置项，
# 并且优先级 > .properties文件 > @ZConfigurationProperties标记的类中的默认值

#-------------------提示-------------------


# 下面配置均为程序中 @ZConfigurationProperties 类的默认值，写在这里仅为展示配置项
# 如需自定义配置项，在本文件中覆盖掉即可
# 如：设定server.port=81

# [支持热更新] 意为：程序在运行中，直接修改本配置文件中的值，保存以后就自动在程序中更新为新值，不需要重启程序。
# 但是配置值校验不通过时会重置为旧值，如 server.client.qps=ABC 会出现异常，然后重置为旧值。

# ServerConfigurationProperties 
# -------------------服务器相关配置-------------------

# http服务器监听的端口号
# 默认值：80,支持范围：1-65535
server.port=80

# 对于http请求，是否响应 ZSESSIONID 的Cookie，
# 默认值：false
server.response.z.session.id=false

# 是否响应Date头，配置为true会在响应头新增一个Date头
# 默认值：false
server.response.date=false

# 是否响应Server头，配置为true会在响应头新增一个Server头，值为[server.name]配置项
# 默认值：false
server.response.server=false

# http响应头中的 Server字段值
# 默认值：vo
# 注意：仅在[server.response.server=true]时才响应此值
server.name=vo

# 读取http请求byte[]的容量大小,单位：字节
# 默认值：1024 * 4,支持范围：512 到 1024 * 16
server.byte.buffer.size=#{1024 * 4}

# 限制上传文件的最大KB数,单位：KB
# 默认值：1024 * 1024,支持范围：1到1024 * 1024 * 10
server.upload.file.size=51200

# 上传文件时从[一次性读取内存]改为[边读边写入到临时文件]的阈值,单位：KB
# 默认值：1024,支持范围：100 到 1024 * 100
# 20260525重新加入，超过此值写入临时文件，否则读入内存
server.upload.file.to.temp.size=1024

# 上传文件时存放临时文件的目录
# 默认值：默认为[user.dir]下的temp目录
server.upload.temp.dir=

# 处理http请求的线程的名称前缀，生成的线程以此为前缀分别命名为1、2、3以此类推
# 默认值：vhT-
server.thread.name=vhT-

# 对于程序中resources目录下和[server.static.path]配置项的静态资源是否启动缓存，
# 默认值：true
# 支持热更新
server.static.resource.cache.enable=true

# 静态资源不大于多少才放入缓存，单位：KB
# 默认值：100，支持范围：1 到 1024 * 10
server.static.resource.cache.size=100

# 是否启动服务器QPS[server.qps]限制，
# 默认值：false
server.qps.limit.enabled=false

# 服务器QPS最大值限制，
# 默认值：10000 * 200,支持范围：0 - 10000 * 1000
# 注意：此值最小支持0，配置为0表示不接受任何请求
# 支持热更新
server.qps=#{10000 * 200}

# 请求超过[server.qps]时给客户端的提示语，默认值：访问频繁，请稍后再试
# 支持热更新
server.qps.exceed.message=访问频繁,请稍后再试

# 请求信息的header的大小限制，单位：字节
# header部分的长度超过此值则响应431
# 默认值：1024 * 4,支持范围：512 到 1024 * 16
# 默认值：1024 * 4
server.request.header.size.limit=#{1024 * 4}

# 允许同时存在的连接数
# 默认值：10000 * 1,支持范围：1 到 10000 * 100
# 默认值：10000
server.connection.limit=#{10000 * 1}

# 是否启用对一个client的qps限制
# 默认值：false
server.enable.client.qps=false

# 对于同一个客户端的QPS限制，
# 当前程序中暂定为ip和User-Agent相同就认为是同一个客户端，
# 如需自定义[如何判定为同一个客户端]可覆盖RequestValidatorAdapter中相关方法
# 默认值：10000 * 200,支持范围：10 - 10000 * 1000
# 支持热更新
server.client.qps=#{10000 * 200}

# 对于同一个ZSESSIONID的QPS限制
# 注意：仅当 [server.response.z.session.id]配置为true时本配置项才生效
# 默认值：10000 * 200,支持范围：10 - 10000 * 1000
# 支持热更新
server.session.id.qps=#{10000 * 200}

# 支持的METHOD，多个用,符号分开
# 默认值：GET,POST,PUT,DELETE,HEAD,CONNECT,TRACE,OPTIONS,PATCH
# 支持范围：GET,POST,PUT,DELETE,HEAD,CONNECT,TRACE,OPTIONS,PATCH
server.method=GET,POST,PUT,DELETE,HEAD,CONNECT,TRACE,OPTIONS,PATCH

# 是否启用内置的 StaticController
# 如果配置为false，则是不需要处理静态文件(resources目录下的静态文件/[server.static.path]配置的路径的静态文件)
# 或者是自定义了处理静态文件的 Controller
# 默认值：true
server.static.controller.enable=true

# StaticController 接口响应的Content-Type
# <k,v>配置为<文件后缀名,响应的Content-Type>，如:
# server.static.controller.content.type.jpg=image/jpg
# 默认值：如下
server.static.controller.content.type.jpg=image/jpg
server.static.controller.content.type.mp4=video/mp4 
server.static.controller.content.type.mp3=audio/mp3 
server.static.controller.content.type.txt=text/plain;charset=UTF-8
server.static.controller.content.type.css=text/css;charset=UTF-8
server.static.controller.content.type.pdf=application/pdf
server.static.controller.content.type.ico=image/x-icon
server.static.controller.content.type.gif=image/gif
server.static.controller.content.type.png=image/png
server.static.controller.content.type.jpeg=image/jpeg
server.static.controller.content.type.doc=application/msword
server.static.controller.content.type.js=application/javascript
server.static.controller.content.type.html=text/html;charset=UTF-8
server.static.controller.content.type.wav=audio/wav

# StaticController 中允许的Referer，如：http://xxx.com/
# 非来自此Referer的请求会被拒绝-响应403
# 注意：本配置项仅在[staticPath]未配置的情况下，即未启用静态文件服务器的情况下才生效。
# 默认值：无
server.static.controller.referers.allowed[0]=

# 是否启用静态文件预压缩
